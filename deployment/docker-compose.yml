version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Vignan Smart Access — Core FastAPI & AI Agent Engine Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: vignan-gate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Vignan Smart Access
      - ENVIRONMENT=production
      - DB_URL=sqlite+aiosqlite:///./vignan_gate.db
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - LOG_LEVEL=info
    volumes:
      - ../vignan_gate.db:/app/vignan_gate.db
      - ../vignan-logo.jpg:/app/vignan-logo.jpg
      - ../index.html:/app/index.html
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/gates/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vignan-net

  # ----------------------------------------------------------------------------
  # Eclipse Mosquitto — Edge MQTT Telemetry & Actuation Message Broker
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: vignan-gate-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - vignan-net

networks:
  vignan-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
